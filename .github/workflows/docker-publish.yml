# Builds both images with Docker Compose, runs and tests the full stack,
# then pushes the images to Docker Hub.
#
# Needs (repo Settings -> Secrets and variables -> Actions):
#   variable DOCKERHUB_USERNAME  - your Docker Hub username
#   secret   DOCKERHUB_TOKEN     - a Docker Hub access token with Read & Write permission
name: Docker build, test and push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Docker and Compose versions
        run: |
          docker --version
          docker compose version
          echo "Docker Hub user: $DOCKERHUB_USERNAME"

      - name: docker compose config
        run: docker compose config

      - name: docker compose build
        run: docker compose build

      - name: docker images
        run: docker images "$DOCKERHUB_USERNAME/*"

      - name: docker compose up -d
        run: docker compose up -d

      - name: Wait for both services
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/health >/dev/null; then echo "Frontend and backend are up"; break; fi
            echo "waiting ($i)..."; sleep 2
          done
          curl -s http://localhost:3000/health; echo

      - name: docker compose ps
        run: docker compose ps

      - name: Shared network - both containers on app-network
        run: |
          docker network ls
          docker network inspect docker-assignment_app-network \
            --format '{{range .Containers}}{{.Name}}  {{.IPv4Address}}{{"\n"}}{{end}}'
          echo "--- frontend container resolving the backend by service name ---"
          docker exec express-frontend wget -qO- http://backend:5000/health; echo

      - name: Test - frontend form page
        run: curl -s http://localhost:3000/ | grep -E "<title>|<h1>|name=\"(name|email|course|message)\""

      - name: Test - valid form submission (expect redirect to /success)
        run: |
          curl -s -i -X POST http://localhost:3000/submit \
            -d "name=samriddhi mishra" -d "email=samriddhi@example.com" -d "course=Docker" \
            -d "message=Testing Docker Compose" | grep -iE "^HTTP|^Location"
          curl -s -L -X POST http://localhost:3000/submit \
            -d "name=aarav sharma" -d "email=aarav@example.com" -d "course=DevOps" | grep "<h1>"

      - name: Test - invalid submission (error shown on the same page)
        run: |
          curl -s -i -X POST http://localhost:3000/submit -d "name=Test" -d "email=not-an-email" -d "course=Docker" \
            | grep -E "^HTTP|class=\"error\""

      - name: Test - data processed and stored by the backend
        run: |
          curl -s http://localhost:5000/submissions | python3 -m json.tool
          curl -s http://localhost:5000/api | python3 -m json.tool | head -n 20

      - name: docker compose logs
        run: docker compose logs --no-color

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker compose push
        run: docker compose push

      - name: Verify - pull the images back from Docker Hub
        run: |
          docker compose down
          docker rmi "$DOCKERHUB_USERNAME/docker-assignment-backend:latest" "$DOCKERHUB_USERNAME/docker-assignment-frontend:latest"
          docker pull "$DOCKERHUB_USERNAME/docker-assignment-backend:latest"
          docker pull "$DOCKERHUB_USERNAME/docker-assignment-frontend:latest"
          docker images "$DOCKERHUB_USERNAME/*"
